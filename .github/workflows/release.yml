name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux-x64:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libvulkan-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libglib2.0-dev \
            libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --bin sketch-rs --bin sketch-rs-mcp
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/sketch-rs target/release/sketch-rs-mcp dist/
          chmod +x dist/sketch-rs dist/sketch-rs-mcp
          tar -C dist -czf sketch-rs-${{ github.ref_name }}-linux-x64.tar.gz sketch-rs sketch-rs-mcp
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: sketch-rs-${{ github.ref_name }}-linux-x64.tar.gz

  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --bin sketch-rs --bin sketch-rs-mcp
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/sketch-rs.exe dist/
          Copy-Item target/release/sketch-rs-mcp.exe dist/
          Compress-Archive -Path dist/sketch-rs.exe,dist/sketch-rs-mcp.exe -DestinationPath sketch-rs-${{ github.ref_name }}-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: sketch-rs-${{ github.ref_name }}-windows-x64.zip

  build-macos-arm64:
    name: Build macOS arm64 (M-series)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target aarch64-apple-darwin --bin sketch-rs --bin sketch-rs-mcp
      - name: Package
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/sketch-rs target/aarch64-apple-darwin/release/sketch-rs-mcp dist/
          chmod +x dist/sketch-rs dist/sketch-rs-mcp
          tar -C dist -czf sketch-rs-${{ github.ref_name }}-macos-arm64.tar.gz sketch-rs sketch-rs-mcp
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: sketch-rs-${{ github.ref_name }}-macos-arm64.tar.gz

  release:
    name: Publish release
    needs:
      - build-linux-x64
      - build-windows-x64
      - build-macos-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v0.1.0' }}
          name: Sketch ${{ github.ref_name || 'v0.1.0' }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            artifacts/*
